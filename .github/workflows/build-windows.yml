name: Build Windows Installer

# Runs when you push a tag like v0.1.0, or by hand from the Actions tab.
# NOTE: the installer is NOT code-signed, so Windows SmartScreen will warn on first run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # postinstall runs `electron-builder install-app-deps`, which rebuilds better-sqlite3 for Electron.
      - name: Install dependencies
        run: npm ci

      # Tests run under plain Node, so rebuild better-sqlite3 for Node first.
      # electron-builder rebuilds it for Electron again when packaging (npmRebuild).
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm rebuild better-sqlite3
          npm test

      - name: Build Windows installer (x64 NSIS)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: retail-pos-windows-installer
          path: release/*.exe
          if-no-files-found: error
